[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisper-mcp-server"
version = "0.1.0"
description = "MCP Server für den selbst gehosteten Whisper-Transkriptions-Service"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
whisper-mcp-server = "whisper_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_mcp_server"]
